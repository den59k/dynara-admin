name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test (backend + frontend units)
        run: bun test

      - name: Test frontend components (vitest)
        run: bun run test
        working-directory: packages/frontend

      - name: Typecheck frontend
        run: bunx vue-tsc --noEmit -p tsconfig.json
        working-directory: packages/frontend

      # The bundled built-in icons must be the same artwork as the icons the
      # backend resolves from the embedded pack, or the panel mixes styles.
      - name: Check built-in icons are in sync with the icon pack
        run: bun scripts/sync-builtin-icons.ts --check
        working-directory: packages/frontend

      - name: Build frontend
        run: bun run build.ts
        working-directory: packages/frontend

      - name: Build backend
        run: bun run build
        working-directory: packages/backend

  publish:
    # Publishes packages/backend (dynara-admin) to npm on a v* tag.
    #
    # Authentication is npm trusted publishing (OIDC): no token is stored
    # anywhere. On npmjs.com the package names this repository and `ci.yml` as
    # its trusted publisher, so renaming or moving this file breaks publishing
    # until that setting is updated.
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange the job's OIDC token for publish rights
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Build backend bundle
        run: bun run build
        working-directory: packages/backend

      - name: Build frontend (emits dist/frontend + type declarations)
        run: bun run build.ts
        working-directory: packages/frontend

      # The tag must match package.json's version, or the push would publish
      # (or skip) a different version than the tag says. A version already on
      # the registry is skipped, so re-running a release is safe.
      - name: Publish to npm
        working-directory: packages/backend
        run: |
          npm --version
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/backend/package.json version $version"
            exit 1
          fi
          spec="dynara-admin@$version"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "::warning::$spec is already on the registry, skipping"
            exit 0
          fi
          if ! npm publish --access public; then
            echo "::error::npm refused $spec. On npmjs.com, is $GITHUB_REPOSITORY + ci.yml set as its trusted publisher?"
            exit 1
          fi
